spring.application.name=app

spring.main.web-application-type=none

# RUST NATIVE LIBRARY
# native.library.path=${NATIVE_LIBRARY_PATH:/home/diogo/devel/java/app/crates/jr_bidir/target/release/libjr_bidir.so}
native.library.path=/app/native/libjr_bidir.so

# Este laboratorio nao utiliza Spring Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orders-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:8192;databaseName=master;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# AWS SQS - LocalStack
aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:test}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.sqs.endpoint=${AWS_SQS_ENDPOINT:http://localhost:4566}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:http://localhost:4566/000000000000/financial-operations}
aws.sqs.poll-delay-ms=2000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false